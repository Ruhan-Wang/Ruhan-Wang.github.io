[[news]]
date = "2026-05"
content = "🏅 Recognized as a **Gold Reviewer** for **ICML 2026**, placing among the top reviewers for this year's conference (with complimentary registration)."

[[news]]
date = "2026-05"
content = "🚀 Started my Ph.D. Research Internship at **Tencent AI Lab (Hunyuan Frontier Lab)** in Bellevue, WA, hosted by [Dr. Kishan Panaganti](https://sites.google.com/a/tamu.edu/kpb/home). Working on **Agentic Reinforcement Learning** for large language model agents."

[[news]]
date = "2026-05"
content = "🎉 Our paper *Instance-Dependent Continuous-Time RL via Maximum Likelihood Estimation* — joint work with Runze Zhao, Yue Yu, Chunfeng Huang, and [Prof. Dongruo Zhou](https://sites.google.com/view/drzhou) — has been accepted to **ICML 2026** (Seoul)!"

[[news]]
date = "2026-04"
content = "📝 Submitted *FERA: Uncertainty-Aware Federated Reasoning with Large Language Models* to **COLM 2026** — a parameter-free federated reasoning framework that uses uncertainty quantification for cross-client knowledge integration. With Chengkai Huang, Zhiyong Wang, Rui Wang, Tong Yu, Lina Yao, and [Prof. Dongruo Zhou](https://sites.google.com/view/drzhou)."

[[news]]
date = "2026-04"
content = "🏅 Recognized as a **Top 25% Reviewer** for ICLR 2026."

[[news]]
date = "2025-07"
content = "🛫 Attended **ICML 2025** in Vancouver to present *Federated In-Context Learning: Iterative Refinement for Improved Answer Quality* — a privacy-preserving Fed-ICL framework with theoretical equivalence to established FL algorithms. With Zhiyong Wang, Chengkai Huang, Rui Wang, Tong Yu, Lina Yao, John C.S. Lui, and [Prof. Dongruo Zhou](https://sites.google.com/view/drzhou)."

[[news]]
date = "2025-06"
content = "🛫 Attended **L4DC 2025** in Ann Arbor, MI to present *Safe Decision Transformer with Learning-based Constraints* — our Constrained Q-learning Decision Transformer (CQDT) for safe offline RL. Joint work with [Prof. Dongruo Zhou](https://sites.google.com/view/drzhou); previously presented at the NeurIPS 2024 Safe Generative AI Workshop."

[[news]]
date = "2025-04"
content = "🎓 Advanced to **Ph.D. Candidacy** in Computer Engineering at Indiana University after passing the qualifying examination."

[[news]]
date = "2025-03"
content = "📚 Our work *Towards Agentic Recommender Systems in the Era of Multimodal LLMs* has been accepted to **ACM TIST** — a formal LLM-ARS framework spanning user profiling, memory, planning, and action selection, identifying seven open challenges. Collaboration led by Chengkai Huang with the team at UNSW, Adobe Research, UCSD, and Indiana University."

[[news]]
date = "2024-12"
content = "🎓 Completed my **M.S. in Computer Engineering** at Indiana University Bloomington."

[[news]]
date = "2024-08"
content = "🔬 Wrapped up my Ph.D. Research Internship at **Mitsubishi Electric Research Laboratories (MERL)** in Cambridge, MA, hosted by [Dr. Toshiaki Koike-Akino](https://scholar.google.com/citations?user=ZMo2ZM0AAAAJ&hl=en). Worked on quantum machine learning and generative models — resulted in *Quantum Diffusion Models for Few-Shot Learning*, accepted to **ICAD 2025** and the **AAAI 2024 Quantum Computing & AI Workshop**."

[[news]]
date = "2024-01"
content = "⭐ *LLMCarbon: Modeling the End-to-End Carbon Footprint of Large Language Models* selected for **Oral Presentation** at **ICLR 2024** (Vienna) — projecting LLM carbon footprints across training, inference, experimentation, and storage. Joint work with Ahmad Faiz, Sotaro Kaneda, Rita Osi, Parteek Sharma, Fan Chen, and Lei Jiang."

[[news]]
date = "2023-08"
content = "🤝 Joined the **Machine Learning Lab** at Indiana University, advised by [Prof. Dongruo Zhou](https://sites.google.com/view/drzhou) — shifting research focus toward reinforcement learning, foundation models, and agentic AI."

[[news]]
date = "2022-08"
content = "🌟 Started my Ph.D. journey in **Computer Engineering** at Indiana University Bloomington, joining the Quantum Computing Lab under Prof. Fan Chen."
